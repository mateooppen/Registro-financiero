<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Finanzas personales</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="topbar-title">
      <i class="ti ti-report-money" aria-hidden="true"></i>
      Finanzas
    </div>
    <div class="month-nav hidden" id="month-nav">
      <button class="nav-btn" id="prev-m" aria-label="Mes anterior"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
      <span class="month-label" id="month-lbl"></span>
      <button class="nav-btn" id="next-m" aria-label="Mes siguiente"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
    </div>
    <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" aria-label="Cambiar tema"><i class="ti ti-sun" aria-hidden="true"></i></button>
  </div>

  <div id="card-banner" class="banner banner--top hidden">
    <i class="ti ti-credit-card" aria-hidden="true"></i>
    <span class="banner-text" id="card-banner-text"></span>
    <button class="banner-close" onclick="dismissCardBanner()" aria-label="Cerrar"><i class="ti ti-x"></i></button>
  </div>
  <div id="rent-banner" class="banner banner--top hidden">
    <i class="ti ti-home-up" aria-hidden="true"></i>
    <span class="banner-text" id="rent-banner-text"></span>
    <button class="banner-close" onclick="dismissRentBanner()" aria-label="Cerrar"><i class="ti ti-x"></i></button>
  </div>

  <div id="screen-auth" class="auth-screen">
    <div class="auth-icon"><i class="ti ti-lock" aria-hidden="true"></i></div>
    <div class="auth-title">Finanzas personales</div>
    <div class="auth-desc">Tus datos se guardan en tu propio Google Drive, seguros y accesibles desde cualquier dispositivo.</div>
    <a id="auth-link" href="#" class="auth-btn">
      <img src="https://www.google.com/favicon.ico" alt="Google">
      Continuar con Google
    </a>
    <div class="auth-error hidden" id="auth-error"></div>
  </div>

  <div id="screen-loading" class="loading-screen hidden">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">Conectando...</div>
  </div>

  <div id="screen-app" class="content hidden">
    <div class="metrics" id="metrics-grid"></div>
    <div class="card hidden" id="credit-card-detail"></div>
    <div class="credit-banner hidden" id="credit-banner"><i class="ti ti-credit-card" aria-hidden="true"></i><span id="credit-banner-text"></span></div>
    <div class="save-bar hidden" id="save-bar"><i class="ti ti-cloud-upload" aria-hidden="true"></i><span id="save-bar-text"></span></div>

    <div class="card">
      <div class="section-label">Nuevo movimiento</div>
      <div class="form-col">
        <div class="type-toggle">
          <button id="btn-exp" class="act-exp" onclick="setType('expense')"><i class="ti ti-arrow-up-circle icon-md" aria-hidden="true"></i> Gasto</button>
          <button id="btn-inc" onclick="setType('income')"><i class="ti ti-arrow-down-circle icon-md" aria-hidden="true"></i> Ingreso</button>
        </div>
        <div class="pay-toggle hidden" id="pay-toggle">
          <button id="btn-cash" class="act-cash" onclick="setPayment('cash')"><i class="ti ti-cash icon-sm" aria-hidden="true"></i> Contado</button>
          <button id="btn-card" onclick="setPayment('card')"><i class="ti ti-credit-card icon-sm" aria-hidden="true"></i> Tarjeta</button>
        </div>
        <select id="installments-inp" class="hidden">
          <option value="1">1 pago</option>
          <option value="2">2 cuotas</option>
          <option value="3">3 cuotas</option>
          <option value="6">6 cuotas</option>
          <option value="12">12 cuotas</option>
          <option value="18">18 cuotas</option>
        </select>
        <select id="account-select" class="hidden" onchange="setAccount(this.value)"></select>
      </div>
      <div class="form-fields">
        <input type="text" id="desc-inp" placeholder="Descripción" autocomplete="off">
        <div class="form-row-2">
          <input type="number" id="amount-inp" placeholder="Monto" min="0" step="0.01" inputmode="decimal">
          <input type="date" id="date-inp">
        </div>
        <button class="add-btn" onclick="addTx()"><i class="ti ti-plus icon-xl" aria-hidden="true"></i> Agregar</button>
      </div>
    </div>

    <div class="card hidden" id="installments-card">
      <div class="section-label">Cuotas pendientes</div>
      <div class="scroll-row" id="inst-summary"></div>
      <button class="inst-toggle" id="inst-toggle-btn" onclick="toggleInstDetail()"><i class="ti ti-chevron-down icon-md" aria-hidden="true"></i> Ver detalle de cuotas</button>
      <div class="inst-detail collapsed" id="inst-detail"></div>
    </div>

    <div class="card">
      <div class="section-label">Movimientos del mes</div>
      <div class="tx-list" id="tx-list"></div>
    </div>

    <!--
      NO ELIMINAR: gráfico de evolución de 6 meses, oculto temporalmente porque no aporta valor actualmente,
      pero puede volver a ser útil más adelante. Mantener el código intacto.

      <div class="card">
        <div class="section-label">Evolución 6 meses</div>
        <div class="legend-row">
          <span class="legend-item"><span class="legend-dot" style="background:#5DCAA5"></span>Ingresos</span>
          <span class="legend-item"><span class="legend-dot" style="background:#F0997B"></span>Contado</span>
          <span class="legend-item"><span class="legend-dot" style="background:#85B7EB"></span>Crédito cobrado</span>
        </div>
        <div class="chart-wrap"><canvas id="hist-chart" role="img" aria-label="Evolución mensual de ingresos y gastos">Gráfico de barras mensual.</canvas></div>
      </div>
    -->

    <div class="card">
      <div class="section-label">Historial</div>
      <div class="hist-row" id="hist-row"></div>
    </div>

    <div class="card">
      <button class="settings-toggle" onclick="toggleSettings()" id="settings-toggle" aria-expanded="false">
        <span class="settings-toggle-label"><i class="ti ti-settings icon-lg" aria-hidden="true"></i> Configuración de tarjeta</span>
        <i class="ti ti-chevron-down chevron" id="settings-chevron" aria-hidden="true"></i>
      </button>
      <div class="settings-body collapsed" id="settings-body">
        <div>
          <label for="card-name-inp">Nombre de la tarjeta</label>
          <input type="text" id="card-name-inp" placeholder="Visa, Mastercard, Naranja...">
        </div>
        <div>
          <label for="close-day-inp">Día de cierre</label>
          <input type="number" id="close-day-inp" min="1" max="31" inputmode="numeric">
        </div>
        <div>
          <label for="due-day-inp">Día de vencimiento</label>
          <input type="number" id="due-day-inp" min="1" max="31" inputmode="numeric">
        </div>
        <button class="add-btn" onclick="saveSettings()"><i class="ti ti-check icon-lg" aria-hidden="true"></i> Guardar configuración</button>
        <button class="logout-btn" onclick="signOut()"><i class="ti ti-logout icon-lg" aria-hidden="true"></i> Cerrar sesión</button>
      </div>
    </div>

    <div class="card">
      <button class="settings-toggle" onclick="toggleRentSettings()" id="rent-toggle" aria-expanded="false">
        <span class="settings-toggle-label">
          <i class="ti ti-home-dollar icon-lg" aria-hidden="true"></i>
          Configuración de Alquiler
        </span>
        <i class="ti ti-chevron-down chevron" id="rent-chevron" aria-hidden="true"></i>
      </button>

      <div class="settings-body collapsed" id="rent-body">
        <div class="form-grid">
          <div class="full">
            <label>Monto Inicial ($)</label>
            <input type="number" id="rent-base-amount" placeholder="Ej: 200000">
          </div>
          <div>
            <label>Día de cobro</label>
            <input type="number" id="rent-day" min="1" max="31">
          </div>
          <div>
            <label>Inicio contrato</label>
            <div class="flex-row">
              <select id="rent-start-month-m" class="flex-1">
                <option value="">Mes</option>
                <option value="01">Enero</option><option value="02">Febrero</option><option value="03">Marzo</option>
                <option value="04">Abril</option><option value="05">Mayo</option><option value="06">Junio</option>
                <option value="07">Julio</option><option value="08">Agosto</option><option value="09">Septiembre</option>
                <option value="10">Octubre</option><option value="11">Noviembre</option><option value="12">Diciembre</option>
              </select>
              <select id="rent-start-month-y" class="flex-1"></select>
            </div>
          </div>
          <div>
            <label>Aumento cada (meses)</label>
            <input type="number" id="rent-freq" placeholder="6">
          </div>
          <div>
            <label>% de aumento</label>
            <input type="number" id="rent-percent" placeholder="15">
          </div>
          <button class="add-btn full" onclick="saveRentConfig()">
            <i class="ti ti-check" aria-hidden="true"></i> Guardar configuración
          </button>
        </div>
      </div>
    </div>

    <div class="card">
      <button class="settings-toggle" onclick="toggleAccountsSettings()" id="accounts-toggle" aria-expanded="false">
        <span class="settings-toggle-label"><i class="ti ti-wallet icon-lg" aria-hidden="true"></i> Configuración de cuentas</span>
        <i class="ti ti-chevron-down chevron" id="accounts-chevron" aria-hidden="true"></i>
      </button>
      <div class="settings-body collapsed" id="accounts-body">
        <div id="accounts-list"></div>
        <button class="add-btn" onclick="addAccount()"><i class="ti ti-plus icon-lg" aria-hidden="true"></i> Nueva cuenta</button>
      </div>
    </div>
  </div>
</div>
<div class="banner banner--bottom hidden" id="session-banner">
  <i class="ti ti-clock-exclamation" aria-hidden="true"></i>
  <span class="banner-text">Tu sesión está por vencer.</span>
  <button class="banner-action" onclick="renewSession()">Renovar</button>
</div>
<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>
