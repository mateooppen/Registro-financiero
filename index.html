<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    <title>Finanzas personales</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    
    <!-- Archivo de Estilos (Ahora CSS puro) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="shell">
        <div class="topbar">
            <div class="topbar-title">
                <i class="ti ti-report-money" aria-hidden="true"></i>
                Finanzas
            </div>
            <div class="month-nav hidden" id="month-nav">
                <button class="nav-btn" id="prev-m" aria-label="Mes anterior"><i class="ti ti-chevron-left"></i></button>
                <span class="month-label" id="month-lbl"></span>
                <button class="nav-btn" id="next-m" aria-label="Mes siguiente"><i class="ti ti-chevron-right"></i></button>
            </div>
        </div>

        <div id="screen-auth" class="auth-screen">
            <div class="auth-icon"><i class="ti ti-lock"></i></div>
            <div class="auth-title">Finanzas personales</div>
            <div class="auth-desc">Tus datos se guardan en tu propio Google Drive, seguros y accesibles desde cualquier dispositivo.</div>
            <a id="auth-link" href="#" class="auth-btn">
                <img src="https://www.google.com/favicon.ico" alt="Google">
                Continuar con Google
            </a>
            <div class="auth-error hidden" id="auth-error"></div>
        </div>

        <div id="screen-loading" class="loading-screen hidden">
            <div class="spinner"></div>
            <div class="loading-text" id="loading-text">Conectando...</div>
        </div>

        <div id="screen-app" class="content hidden">
            <div class="metrics" id="metrics-grid"></div>
            <div class="credit-banner hidden" id="credit-banner"><i class="ti ti-credit-card"></i><span id="credit-banner-text"></span></div>
            <div class="save-bar hidden" id="save-bar"><i class="ti ti-cloud-upload"></i><span id="save-bar-text"></span></div>

            <div class="card">
                <div class="section-label">Nuevo movimiento</div>
                <div class="form-container">
                    <div class="type-toggle">
                        <button id="btn-exp" class="act-exp" onclick="setType('expense')"><i class="ti ti-arrow-up-circle"></i> Gasto</button>
                        <button id="btn-inc" onclick="setType('income')"><i class="ti ti-arrow-down-circle"></i> Ingreso</button>
                    </div>
                    <div class="pay-toggle hidden" id="pay-toggle">
                        <button id="btn-cash" class="act-cash" onclick="setPayment('cash')"><i class="ti ti-cash"></i> Contado</button>
                        <button id="btn-card" onclick="setPayment('card')"><i class="ti ti-credit-card"></i> Tarjeta</button>
                    </div>
                    <select id="installments-inp" class="hidden">
                        <option value="1">1 pago</option>
                        <option value="2">2 cuotas</option>
                        <option value="3">3 cuotas</option>
                        <option value="6">6 cuotas</option>
                        <option value="12">12 cuotas</option>
                        <option value="18">18 cuotas</option>
                    </select>
                </div>
                <div class="form-fields">
                    <input type="text" id="desc-inp" placeholder="Descripción" autocomplete="off">
                    <div class="form-row-2">
                        <input type="number" id="amount-inp" placeholder="Monto" min="0" step="0.01" inputmode="decimal">
                        <input type="date" id="date-inp">
                    </div>
                    <button class="add-btn" onclick="addTx()"><i class="ti ti-plus"></i> Agregar</button>
                </div>
            </div>

            <div class="card">
                <div class="section-label">Movimientos del mes</div>
                <div class="tx-list" id="tx-list"></div>
            </div>

            <div class="card">
                <button class="settings-toggle" onclick="toggleRentSettings()" id="rent-toggle" aria-expanded="false">
                    <span style="display:flex;align-items:center;gap:8px"><i class="ti ti-home-dollar"></i> Configuración de Alquiler</span>
                    <i class="ti ti-chevron-down" id="rent-chevron"></i>
                </button>
                <div class="settings-body hidden" id="rent-body">
                    <div class="grid-form">
                        <div class="full-width">
                            <label>Monto Inicial ($)</label>
                            <input type="number" id="rent-base-amount" placeholder="Ej: 200000">
                        </div>
                        <div>
                            <label>Día de cobro</label>
                            <input type="number" id="rent-day" min="1" max="31">
                        </div>
                        <div>
                            <label>Inicio contrato</label>
                            <input type="date" id="rent-start-date">
                        </div>
                        <div>
                            <label>Aumento cada (meses)</label>
                            <input type="number" id="rent-freq" placeholder="6">
                        </div>
                        <div>
                            <label>% de aumento</label>
                            <input type="number" id="rent-percent" placeholder="15">
                        </div>
                        <button class="add-btn full-width" onclick="saveRentConfig()"><i class="ti ti-check"></i> Guardar configuración</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <button class="settings-toggle" onclick="toggleSettings()" id="settings-toggle" aria-expanded="false">
                    <span style="display:flex;align-items:center;gap:8px"><i class="ti ti-settings"></i> Configuración de tarjeta</span>
                    <i class="ti ti-chevron-down" id="settings-chevron"></i>
                </button>
                <div class="settings-body hidden" id="settings-body">
                    <div>
                        <label for="card-name-inp">Nombre de la tarjeta</label>
                        <input type="text" id="card-name-inp" placeholder="Visa, Mastercard...">
                    </div>
                    <div>
                        <label for="close-day-inp">Día de cierre</label>
                        <input type="number" id="close-day-inp" min="1" max="31">
                    </div>
                    <button class="add-btn" onclick="saveSettings()"><i class="ti ti-check"></i> Guardar tarjeta</button>
                    <button class="logout-btn" onclick="signOut()"><i class="ti ti-logout"></i> Cerrar sesión</button>
                </div>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
