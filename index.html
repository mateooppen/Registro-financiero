<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Finanzas personales</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --bg:#ffffff; --bg2:#f5f5f3; --bg3:#eeede9;
  --text:#1a1a18; --text2:#6b6b67; --text3:#9b9b97;
  --border:rgba(0,0,0,0.1); --border2:rgba(0,0,0,0.2);
  --green:#1D9E75; --green-bg:#E1F5EE; --green-text:#0F6E56;
  --red:#D85A30; --red-bg:#FAECE7; --red-text:#993C1D;
  --blue:#185FA5; --blue-bg:#E6F1FB; --blue-text:#0C447C;
  --amber-bg:#FAEEDA; --amber-text:#854F0B;
  --radius:10px; --radius-lg:14px;
  --font:'DM Sans',system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1a; --bg2:#252523; --bg3:#2e2e2b;
    --text:#f0f0ec; --text2:#a0a09c; --text3:#6a6a66;
    --border:rgba(255,255,255,0.1); --border2:rgba(255,255,255,0.2);
    --green:#2ec48f; --green-bg:#0d3326; --green-text:#5DCAA5;
    --red:#e87654; --red-bg:#3a1a10; --red-text:#F0997B;
    --blue:#5fa8e0; --blue-bg:#0d2640; --blue-text:#85B7EB;
    --amber-bg:#2e1f05; --amber-text:#EF9F27;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg3);font-family:var(--font);color:var(--text)}
.shell{max-width:520px;margin:0 auto;background:var(--bg3);min-height:100dvh}
.topbar{background:var(--bg);border-bottom:0.5px solid var(--border);padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500}
.topbar-title i{font-size:18px;color:var(--text2)}
.month-nav{display:flex;align-items:center;gap:4px}
.nav-btn{background:none;border:0.5px solid var(--border2);border-radius:8px;width:32px;height:32px;cursor:pointer;color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:16px}
.nav-btn:active{background:var(--bg2)}
.month-label{font-size:14px;font-weight:500;min-width:130px;text-align:center;color:var(--text)}
.auth-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80dvh;padding:2rem;text-align:center;gap:20px}
.auth-icon{width:64px;height:64px;border-radius:50%;background:var(--blue-bg);display:flex;align-items:center;justify-content:center}
.auth-icon i{font-size:28px;color:var(--blue-text)}
.auth-title{font-size:18px;font-weight:500}
.auth-desc{font-size:14px;color:var(--text2);line-height:1.5;max-width:280px}
.auth-btn{display:flex;align-items:center;gap:10px;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius-lg);padding:14px 24px;cursor:pointer;font-size:14px;font-weight:500;font-family:var(--font);color:var(--text);text-decoration:none}
.auth-btn:active{background:var(--bg2)}
.auth-btn img{width:20px;height:20px}
.auth-error{background:var(--red-bg);border-radius:var(--radius);padding:10px 14px;font-size:13px;color:var(--red-text);max-width:300px;line-height:1.5;text-align:center}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80dvh;gap:12px}
.spinner{width:28px;height:28px;border:2.5px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--text2)}
.content{padding:12px 12px 100px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--bg);border-radius:var(--radius-lg);border:0.5px solid var(--border);overflow:hidden}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border-radius:var(--radius-lg);overflow:hidden;border:0.5px solid var(--border)}
.metric{background:var(--bg);padding:14px 16px}
.metric-label{font-size:11px;color:var(--text2);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.metric-label i{font-size:12px}
.metric-value{font-size:20px;font-weight:500}
.green{color:var(--green)} .red{color:var(--red)} .blue{color:var(--blue)}
.pos{color:var(--green)} .neg{color:var(--red)}
.credit-banner{background:var(--blue-bg);border-radius:var(--radius-lg);border:0.5px solid rgba(55,138,221,0.25);padding:12px 14px;font-size:13px;color:var(--blue-text);display:flex;align-items:flex-start;gap:8px}
.credit-banner i{font-size:16px;margin-top:1px;flex-shrink:0}
.save-bar{background:var(--amber-bg);border-radius:var(--radius-lg);padding:10px 14px;font-size:12px;color:var(--amber-text);display:flex;align-items:center;gap:8px}
.save-bar i{font-size:14px;flex-shrink:0}
.section-label{font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;padding:14px 16px 10px}
.type-toggle,.pay-toggle{display:flex;border:0.5px solid var(--border2);border-radius:8px;overflow:hidden}
.type-toggle button,.pay-toggle button{flex:1;padding:0 10px;height:38px;border:none;cursor:pointer;font-size:13px;font-family:var(--font);background:transparent;color:var(--text2);white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:5px}
.act-inc{background:var(--green-bg)!important;color:var(--green-text)!important;font-weight:500!important}
.act-exp{background:var(--red-bg)!important;color:var(--red-text)!important;font-weight:500!important}
.act-cash{background:var(--green-bg)!important;color:var(--green-text)!important;font-weight:500!important}
.act-card{background:var(--blue-bg)!important;color:var(--blue-text)!important;font-weight:500!important}
.form-fields{display:flex;flex-direction:column;gap:8px;padding:0 16px 14px}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=text],input[type=number],input[type=date]{width:100%;height:42px;border:0.5px solid var(--border2);border-radius:8px;background:var(--bg2);color:var(--text);font-size:14px;font-family:var(--font);padding:0 12px;outline:none;-webkit-appearance:none;appearance:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(55,138,221,0.15)}
.add-btn{width:100%;height:44px;border:none;border-radius:8px;background:var(--text);color:var(--bg);font-size:14px;font-weight:500;font-family:var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px}
.add-btn:active{opacity:0.85}
.tx-list{display:flex;flex-direction:column}
.tx-item{display:flex;align-items:center;gap:8px;padding:11px 16px;border-bottom:0.5px solid var(--border)}
.tx-item:last-child{border-bottom:none}
.tx-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.tx-dot.income{background:var(--green)} .tx-dot.cash{background:var(--red)} .tx-dot.card{background:var(--blue)}
.tx-main{flex:1;min-width:0}
.tx-desc{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{font-size:11px;color:var(--text3);margin-top:1px}
.tx-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.tx-amount{font-size:13px;font-weight:500}
.tx-amount.income{color:var(--green)} .tx-amount.cash{color:var(--red)} .tx-amount.card{color:var(--blue)}
.tx-del{background:none;border:none;cursor:pointer;color:var(--text3);padding:4px;border-radius:6px;font-size:15px;line-height:1}
.tx-del:active{background:var(--bg2);color:var(--red)}
.empty{text-align:center;padding:2rem 1rem;color:var(--text3);font-size:13px}
.empty i{font-size:28px;display:block;margin-bottom:8px}
.chart-wrap{position:relative;width:100%;height:180px;padding:0 16px 14px}
.legend-row{display:flex;gap:12px;padding:0 16px 8px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.legend-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.hist-row{display:flex;gap:8px;overflow-x:auto;padding:0 16px 14px;scrollbar-width:none}
.hist-row::-webkit-scrollbar{display:none}
.hist-card{background:var(--bg2);border-radius:var(--radius);padding:10px 12px;min-width:110px;cursor:pointer;flex-shrink:0;border:1px solid transparent}
.hist-card:active{background:var(--bg3)}
.hist-card.active{border-color:var(--blue);background:var(--blue-bg)}
.hist-month{font-size:12px;font-weight:500;color:var(--text);margin-bottom:4px}
.hist-nums{display:flex;flex-direction:column;gap:2px;font-size:11px}
.settings-toggle{width:100%;background:none;border:none;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-family:var(--font);font-size:13px;color:var(--text2)}
.settings-toggle:active{background:var(--bg2)}
.settings-body{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px}
.settings-body label{font-size:12px;color:var(--text2);margin-bottom:2px;display:block}
.logout-btn{width:100%;height:44px;border:0.5px solid var(--border2);border-radius:8px;background:transparent;color:var(--text2);font-size:14px;font-family:var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.logout-btn:active{background:var(--bg2)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:13px;font-family:var(--font);z-index:100;opacity:0;transition:opacity 0.2s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="topbar-title">
      <i class="ti ti-report-money" aria-hidden="true"></i>
      Finanzas
    </div>
    <div class="month-nav hidden" id="month-nav">
      <button class="nav-btn" id="prev-m" aria-label="Mes anterior"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
      <span class="month-label" id="month-lbl"></span>
      <button class="nav-btn" id="next-m" aria-label="Mes siguiente"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
    </div>
  </div>

  <div id="screen-auth" class="auth-screen">
    <div class="auth-icon"><i class="ti ti-lock" aria-hidden="true"></i></div>
    <div class="auth-title">Finanzas personales</div>
    <div class="auth-desc">Tus datos se guardan en tu propio Google Drive, seguros y accesibles desde cualquier dispositivo.</div>
    <a id="auth-link" href="#" class="auth-btn">
      <img src="https://www.google.com/favicon.ico" alt="Google">
      Continuar con Google
    </a>
    <div class="auth-error hidden" id="auth-error"></div>
  </div>

  <div id="screen-loading" class="loading-screen hidden">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">Conectando...</div>
  </div>

  <div id="screen-app" class="content hidden">
    <div class="metrics" id="metrics-grid"></div>
    <div class="credit-banner hidden" id="credit-banner"><i class="ti ti-credit-card" aria-hidden="true"></i><span id="credit-banner-text"></span></div>
    <div class="save-bar hidden" id="save-bar"><i class="ti ti-cloud-upload" aria-hidden="true"></i><span id="save-bar-text"></span></div>

    <div class="card">
      <div class="section-label">Nuevo movimiento</div>
      <div style="padding:0 16px 10px;display:flex;flex-direction:column;gap:8px">
        <div class="type-toggle">
          <button id="btn-inc" class="act-inc" onclick="setType('income')"><i class="ti ti-arrow-down-circle" style="font-size:14px" aria-hidden="true"></i> Ingreso</button>
          <button id="btn-exp" onclick="setType('expense')"><i class="ti ti-arrow-up-circle" style="font-size:14px" aria-hidden="true"></i> Gasto</button>
        </div>
        <div class="pay-toggle hidden" id="pay-toggle">
          <button id="btn-cash" class="act-cash" onclick="setPayment('cash')"><i class="ti ti-cash" style="font-size:13px" aria-hidden="true"></i> Contado</button>
          <button id="btn-card" onclick="setPayment('card')"><i class="ti ti-credit-card" style="font-size:13px" aria-hidden="true"></i> Tarjeta</button>
        </div>
      </div>
      <div class="form-fields">
        <input type="text" id="desc-inp" placeholder="Descripción" autocomplete="off">
        <div class="form-row-2">
          <input type="number" id="amount-inp" placeholder="Monto" min="0" step="0.01" inputmode="decimal">
          <input type="date" id="date-inp">

        <button class="add-btn" onclick="addTx()"><i class="ti ti-plus" style="font-size:16px" aria-hidden="true"></i> Agregar</button>
      </div>
    </div>

    <div class="card">
      <div class="section-label">Movimientos del mes</div>
      <div class="tx-list" id="tx-list"></div>
    </div>

    <div class="card">
      <div class="section-label">Evolución 6 meses</div>
      <div class="legend-row">
        <span class="legend-item"><span class="legend-dot" style="background:#5DCAA5"></span>Ingresos</span>
        <span class="legend-item"><span class="legend-dot" style="background:#F0997B"></span>Contado</span>
        <span class="legend-item"><span class="legend-dot" style="background:#85B7EB"></span>Crédito cobrado</span>
      </div>
      <div class="chart-wrap"><canvas id="hist-chart" role="img" aria-label="Evolución mensual de ingresos y gastos">Gráfico de barras mensual.</canvas></div>
    </div>

    <div class="card">
      <div class="section-label">Historial</div>
      <div class="hist-row" id="hist-row"></div>
    </div>

    <div class="card">
      <button class="settings-toggle" onclick="toggleSettings()" id="settings-toggle" aria-expanded="false">
        <span style="display:flex;align-items:center;gap:8px"><i class="ti ti-settings" style="font-size:15px" aria-hidden="true"></i> Configuración de tarjeta</span>
        <i class="ti ti-chevron-down" id="settings-chevron" style="font-size:15px;transition:transform .2s" aria-hidden="true"></i>
      </button>
      <div class="settings-body hidden" id="settings-body">
        <div>
          <label for="card-name-inp">Nombre de la tarjeta</label>
          <input type="text" id="card-name-inp" placeholder="Visa, Mastercard, Naranja...">
        </div>
        <div>
          <label for="close-day-inp">Día de cierre</label>
          <input type="number" id="close-day-inp" min="1" max="31" inputmode="numeric">
        </div>
        <button class="add-btn" onclick="saveSettings()"><i class="ti ti-check" style="font-size:15px" aria-hidden="true"></i> Guardar configuración</button>
        <button class="logout-btn" onclick="signOut()"><i class="ti ti-logout" style="font-size:15px" aria-hidden="true"></i> Cerrar sesión</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const CLIENT_ID = '926576243590-0ffu3hgsn4qmsdua6bekbb0s7443j2cn.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const REDIRECT_URI = 'https://mateooppen.github.io/Registro-financiero';
const FILE_NAME = 'finanzas_data.json';
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

let accessToken = null;
let tokenExpiry = 0;
let driveFileId = null;
let appData = { transactions: [], config: { closeDay: 25, cardName: 'Tarjeta' } };
let curY, curM;
let curType = 'income', curPay = 'cash';
let chartInst = null;
let settingsOpen = false;
let saveTimer = null;

// ── PKCE helpers ──────────────────────────────────────────────────

function base64url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}

async function generatePKCE() {
  const verifier = base64url(crypto.getRandomValues(new Uint8Array(32)));
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  const challenge = base64url(hash);
  return { verifier, challenge };
}

// ── AUTH ──────────────────────────────────────────────────────────

async function buildAuthUrl() {
  const { verifier, challenge } = await generatePKCE();
  const state = base64url(crypto.getRandomValues(new Uint8Array(16)));
  sessionStorage.setItem('pkce_verifier', verifier);
  sessionStorage.setItem('oauth_state', state);
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    response_type: 'code',
    scope: SCOPE,
    state,
    code_challenge: challenge,
    code_challenge_method: 'S256',
    access_type: 'offline',
    prompt: 'select_account'
  });
  return 'https://accounts.google.com/o/oauth2/v2/auth?' + params.toString();
}

async function exchangeCode(code) {
  const verifier = sessionStorage.getItem('pkce_verifier');
  const res = await fetch('https://oauth2.googleapis.com/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      code,
      client_id: CLIENT_ID,
      redirect_uri: REDIRECT_URI,
      grant_type: 'authorization_code',
      code_verifier: verifier
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || 'token_exchange_failed');
  }
  return res.json();
}

function saveToken(token, expiresIn, refreshToken) {
  accessToken = token;
  tokenExpiry = Date.now() + expiresIn * 1000;
  const data = { token, expiry: tokenExpiry };
  if (refreshToken) data.refreshToken = refreshToken;
  sessionStorage.setItem('fp_token', JSON.stringify(data));
}

function loadTokenFromSession() {
  try {
    const raw = sessionStorage.getItem('fp_token');
    if (!raw) return false;
    const { token, expiry } = JSON.parse(raw);
    if (Date.now() > expiry - 60000) { sessionStorage.removeItem('fp_token'); return false; }
    accessToken = token;
    tokenExpiry = expiry;
    return true;
  } catch { return false; }
}

function clearAuth() {
  accessToken = null;
  tokenExpiry = 0;
  sessionStorage.removeItem('fp_token');
  sessionStorage.removeItem('pkce_verifier');
  sessionStorage.removeItem('oauth_state');
}

function signOut() {
  if (!confirm('¿Cerrar sesión?')) return;
  clearAuth();
  driveFileId = null;
  appData = { transactions: [], config: { closeDay: 25, cardName: 'Tarjeta' } };
  history.replaceState(null, '', location.pathname);
  showAuth();
}

// ── DRIVE ─────────────────────────────────────────────────────────

async function driveReq(url, opts = {}) {
  if (!accessToken || Date.now() > tokenExpiry - 60000) {
    clearAuth();
    showAuth('Tu sesión expiró. Volvé a ingresar.');
    throw new Error('token_expired');
  }
  const res = await fetch(url, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + accessToken, ...(opts.headers || {}) }
  });
  if (res.status === 401) {
    clearAuth();
    showAuth('Tu sesión expiró. Volvé a ingresar.');
    throw new Error('unauthorized');
  }
  if (!res.ok) throw new Error('Drive error ' + res.status);
  return res;
}

async function loadOrCreateFile() {
  const res = await driveReq(
    'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%22' + FILE_NAME + '%22&fields=files(id)'
  );
  const data = await res.json();
  if (data.files && data.files.length > 0) {
    driveFileId = data.files[0].id;
    const fileRes = await driveReq('https://www.googleapis.com/drive/v3/files/' + driveFileId + '?alt=media');
    const json = await fileRes.json();
    if (json.transactions) appData.transactions = json.transactions;
    if (json.config) appData.config = { ...appData.config, ...json.config };
  } else {
    await createFile();
  }
}

async function createFile() {
  const meta = { name: FILE_NAME, parents: ['appDataFolder'] };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
  form.append('file', new Blob([JSON.stringify(appData)], { type: 'application/json' }));
  const res = await driveReq(
    'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
    { method: 'POST', body: form }
  );
  const d = await res.json();
  driveFileId = d.id;
}

async function saveToDrive() {
  if (!driveFileId || !accessToken) return;
  showSaveBar('Guardando en Drive...');
  try {
    await driveReq(
      'https://www.googleapis.com/upload/drive/v3/files/' + driveFileId + '?uploadType=media',
      { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(appData) }
    );
    showSaveBar('Guardado', true);
  } catch(e) {
    if (e.message !== 'token_expired' && e.message !== 'unauthorized') {
      showSaveBar('Error al guardar. Reintentando...');
      saveTimer = setTimeout(saveToDrive, 4000);
    }
  }
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToDrive, 900);
}

// ── PANTALLAS ─────────────────────────────────────────────────────

async function showAuth(errorMsg) {
  const url = await buildAuthUrl();
  document.getElementById('auth-link').href = url;
  const errEl = document.getElementById('auth-error');
  if (errorMsg) { errEl.textContent = errorMsg; errEl.classList.remove('hidden'); }
  else { errEl.classList.add('hidden'); }
  document.getElementById('screen-auth').classList.remove('hidden');
  document.getElementById('screen-loading').classList.add('hidden');
  document.getElementById('screen-app').classList.add('hidden');
  document.getElementById('month-nav').classList.add('hidden');
}

function showLoading(msg) {
  document.getElementById('loading-text').textContent = msg || 'Cargando...';
  document.getElementById('screen-auth').classList.add('hidden');
  document.getElementById('screen-loading').classList.remove('hidden');
  document.getElementById('screen-app').classList.add('hidden');
}

function showApp() {
  document.getElementById('screen-auth').classList.add('hidden');
  document.getElementById('screen-loading').classList.add('hidden');
  document.getElementById('screen-app').classList.remove('hidden');
  document.getElementById('month-nav').classList.remove('hidden');
  const now = new Date();
  curY = now.getFullYear(); curM = now.getMonth();
  document.getElementById('date-inp').value = now.toISOString().split('T')[0];
  document.getElementById('card-name-inp').value = appData.config.cardName;
  document.getElementById('close-day-inp').value = appData.config.closeDay;
  render();
}

function showSaveBar(msg, success) {
  const bar = document.getElementById('save-bar');
  document.getElementById('save-bar-text').textContent = msg;
  bar.classList.remove('hidden');
  if (success) setTimeout(() => bar.classList.add('hidden'), 2000);
}

// ── LÓGICA ────────────────────────────────────────────────────────

function fmt(v) { return '$' + Math.abs(v).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0 }); }
function mkey(y, m) { return y + '-' + String(m + 1).padStart(2, '0'); }
function fmtDate(s) { const [, mo, d] = s.split('-'); return d + '/' + mo; }

function computeImpactKey(dateStr, closeDay) {
  const p = dateStr.split('-').map(Number), y = p[0], m = p[1] - 1, d = p[2];
  if (d <= closeDay) {
    return mkey(m + 1 > 11 ? y + 1 : y, m + 1 > 11 ? 0 : m + 1);
  } else {
    const ny1 = m + 1 > 11 ? y + 1 : y, nm1 = m + 1 > 11 ? 0 : m + 1;
    return mkey(nm1 + 1 > 11 ? ny1 + 1 : ny1, nm1 + 1 > 11 ? 0 : nm1 + 1);
  }
}

function setType(t) {
  curType = t;
  document.getElementById('btn-inc').className = t === 'income' ? 'act-inc' : '';
  document.getElementById('btn-exp').className = t === 'expense' ? 'act-exp' : '';
  document.getElementById('pay-toggle').classList.toggle('hidden', t !== 'expense');
}

function setPayment(p) {
  curPay = p;
  document.getElementById('btn-cash').className = p === 'cash' ? 'act-cash' : '';
  document.getElementById('btn-card').className = p === 'card' ? 'act-card' : '';
}

function toggleSettings() {
  settingsOpen = !settingsOpen;
  document.getElementById('settings-body').classList.toggle('hidden', !settingsOpen);
  document.getElementById('settings-chevron').style.transform = settingsOpen ? 'rotate(180deg)' : '';
  document.getElementById('settings-toggle').setAttribute('aria-expanded', settingsOpen);
}

function saveSettings() {
  const name = document.getElementById('card-name-inp').value.trim() || 'Tarjeta';
  const day = Math.min(31, Math.max(1, parseInt(document.getElementById('close-day-inp').value) || 25));
  appData.config = { cardName: name, closeDay: day };
  toggleSettings();
  scheduleSave();
  toast('Configuración guardada');
  render();
}

function addTx() {
  const desc = document.getElementById('desc-inp').value.trim();
  const amount = parseFloat(document.getElementById('amount-inp').value);
  const date = document.getElementById('date-inp').value;
  if (!desc || isNaN(amount) || amount <= 0 || !date) { toast('Completá descripción, monto y fecha'); return; }
  const payMethod = curType === 'expense' ? curPay : 'income';
  const tx = { id: Date.now(), type: curType, payMethod, desc, amount, date };
  if (curType === 'expense' && curPay === 'card') tx.impactKey = computeImpactKey(date, appData.config.closeDay);
  appData.transactions.push(tx);
  document.getElementById('desc-inp').value = '';
  document.getElementById('amount-inp').value = '';
  scheduleSave();
  toast('Movimiento agregado');
  render();
}

function deleteTx(id) {
  if (!confirm('¿Eliminar este movimiento?')) return;
  appData.transactions = appData.transactions.filter(t => t.id !== id);
  scheduleSave();
  render();
}

function getStats(y, m) {
  const key = mkey(y, m), txs = appData.transactions;
  const mtx = txs.filter(t => t.date && t.date.startsWith(key));
  const income = mtx.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
  const cashExp = mtx.filter(t => t.type === 'expense' && t.payMethod === 'cash').reduce((s, t) => s + t.amount, 0);
  const cardAcc = mtx.filter(t => t.type === 'expense' && t.payMethod === 'card').reduce((s, t) => s + t.amount, 0);
  const cardImpact = txs.filter(t => t.payMethod === 'card' && t.impactKey === key).reduce((s, t) => s + t.amount, 0);
  return { income, cashExp, cardAcc, cardImpact, balance: income - cashExp - cardImpact, monthTx: mtx };
}

// ── RENDER ────────────────────────────────────────────────────────

function render() {
  const cfg = appData.config;
  document.getElementById('month-lbl').textContent = MONTHS[curM] + ' ' + curY;
  const { income, cashExp, cardAcc, cardImpact, balance, monthTx } = getStats(curY, curM);

  document.getElementById('metrics-grid').innerHTML = `
    <div class="metric"><div class="metric-label"><i class="ti ti-arrow-down-circle" style="color:var(--green)" aria-hidden="true"></i>Ingresos</div><div class="metric-value green">${fmt(income)}</div></div>
    <div class="metric"><div class="metric-label"><i class="ti ti-cash" style="color:var(--red)" aria-hidden="true"></i>Gastos contado</div><div class="metric-value red">${fmt(cashExp)}</div></div>
    <div class="metric"><div class="metric-label"><i class="ti ti-credit-card" style="color:var(--blue)" aria-hidden="true"></i>Crédito este mes</div><div class="metric-value blue">${fmt(cardAcc)}</div></div>
    <div class="metric"><div class="metric-label"><i class="ti ti-scale" style="color:var(--text2)" aria-hidden="true"></i>Balance real</div><div class="metric-value ${balance >= 0 ? 'pos' : 'neg'}">${balance < 0 ? '-' : ''}${fmt(balance)}</div></div>
  `;

  const banner = document.getElementById('credit-banner');
  if (cardImpact > 0) {
    banner.classList.remove('hidden');
    document.getElementById('credit-banner-text').innerHTML = `Se cobran <strong>${fmt(cardImpact)}</strong> de ${cfg.cardName} este mes (gastos de meses anteriores).`;
  } else { banner.classList.add('hidden'); }

  const sorted = [...monthTx].sort((a, b) => b.date.localeCompare(a.date));
  const list = document.getElementById('tx-list');
  if (!sorted.length) {
    list.innerHTML = '<div class="empty"><i class="ti ti-inbox" aria-hidden="true"></i>No hay movimientos este mes</div>';
  } else {
    list.innerHTML = sorted.map(t => {
      const dc = t.type === 'income' ? 'income' : t.payMethod === 'card' ? 'card' : 'cash';
      const prefix = t.type === 'income' ? '+' : '-';
      const sub = t.payMethod === 'card' && t.impactKey
        ? `${cfg.cardName} · impacta ${t.impactKey}`
        : t.type === 'income' ? 'Ingreso' : 'Contado';
      return `<div class="tx-item">
        <span class="tx-dot ${dc}" aria-hidden="true"></span>
        <div class="tx-main">
          <div class="tx-desc">${t.desc}</div>
          <div class="tx-sub">${fmtDate(t.date)} · ${sub}</div>
        </div>
        <div class="tx-right">
          <span class="tx-amount ${dc}">${prefix}${fmt(t.amount)}</span>
          <button class="tx-del" onclick="deleteTx(${t.id})" aria-label="Eliminar movimiento"><i class="ti ti-x" aria-hidden="true"></i></button>
        </div>
      </div>`;
    }).join('');
  }
  renderChart();
  renderHist(cfg);
}

function renderChart() {
  const months = [];
  for (let i = 5; i >= 0; i--) { let m = curM - i, y = curY; while (m < 0) { m += 12; y--; } months.push({ y, m }); }
  const labels = months.map(({ m }) => MONTHS[m].slice(0, 3));
  const inc  = months.map(({ y, m }) => getStats(y, m).income);
  const cash = months.map(({ y, m }) => getStats(y, m).cashExp);
  const card = months.map(({ y, m }) => getStats(y, m).cardImpact);
  if (chartInst) chartInst.destroy();
  const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  chartInst = new Chart(document.getElementById('hist-chart'), {
    type: 'bar',
    data: { labels, datasets: [
      { label: 'Ingresos', data: inc,  backgroundColor: '#5DCAA5', borderRadius: 3 },
      { label: 'Contado',  data: cash, backgroundColor: '#F0997B', borderRadius: 3 },
      { label: 'Crédito cobrado', data: card, backgroundColor: '#85B7EB', borderRadius: 3 }
    ]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 10 }, color: dark ? '#6a6a66' : '#9b9b97', autoSkip: false } },
        y: { grid: { color: dark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)' }, ticks: { font: { size: 10 }, color: dark ? '#6a6a66' : '#9b9b97', callback: v => '$' + v.toLocaleString('es-AR') } }
      }
    }
  });
}

function renderHist(cfg) {
  const months = [];
  for (let i = 5; i >= 0; i--) { let m = curM - i, y = curY; while (m < 0) { m += 12; y--; } months.push({ y, m }); }
  const cur = mkey(curY, curM);
  document.getElementById('hist-row').innerHTML = months.map(({ y, m }) => {
    const k = mkey(y, m);
    const { income, cashExp, cardImpact, balance } = getStats(y, m);
    return `<div class="hist-card${k === cur ? ' active' : ''}" onclick="goMonth(${y},${m})">
      <div class="hist-month">${MONTHS[m].slice(0, 3)} ${y}</div>
      <div class="hist-nums">
        <span style="color:var(--green)">+${fmt(income)}</span>
        <span style="color:var(--red)">-${fmt(cashExp + cardImpact)}</span>
        <span style="font-weight:500;color:${balance >= 0 ? 'var(--green)' : 'var(--red)'}">${balance < 0 ? '-' : ''}${fmt(balance)}</span>
      </div>
    </div>`;
  }).join('');
}

function goMonth(y, m) { curY = y; curM = m; render(); }

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

document.getElementById('prev-m').addEventListener('click', () => { curM--; if (curM < 0) { curM = 11; curY--; } render(); });
document.getElementById('next-m').addEventListener('click', () => { curM++; if (curM > 11) { curM = 0; curY++; } render(); });

// ── INIT ──────────────────────────────────────────────────────────

async function init() {
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const state = params.get('state');
  const error = params.get('error');

  // Viene de redirect de Google
  if (code || error) {
    history.replaceState(null, '', location.pathname);

    if (error) {
      await showAuth(error === 'access_denied'
        ? 'Acceso denegado. Solo cuentas autorizadas pueden ingresar.'
        : 'Error de autenticación. Intentá de nuevo.');
      return;
    }

    const savedState = sessionStorage.getItem('oauth_state');
    if (state !== savedState) {
      await showAuth('Error de seguridad. Intentá de nuevo.');
      return;
    }

    showLoading('Autenticando...');
    try {
      const tokens = await exchangeCode(code);
      saveToken(tokens.access_token, tokens.expires_in, tokens.refresh_token);
      sessionStorage.removeItem('pkce_verifier');
      sessionStorage.removeItem('oauth_state');
      showLoading('Cargando tus datos...');
      await loadOrCreateFile();
      showApp();
    } catch(e) {
      await showAuth('Error al autenticar. Intentá de nuevo.');
    }
    return;
  }

  // Token válido en sesión
  if (loadTokenFromSession()) {
    showLoading('Cargando tus datos...');
    try {
      await loadOrCreateFile();
      showApp();
    } catch(e) {
      if (e.message !== 'token_expired' && e.message !== 'unauthorized') {
        await showAuth('Error al conectar con Drive. Intentá de nuevo.');
      }
    }
    return;
  }

  // Sin token — pantalla de login
  await showAuth();
}

init();
</script>
