<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Finanzas personales</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f5f5f3;
    --bg3: #eeede9;
    --text: #1a1a18;
    --text2: #6b6b67;
    --text3: #9b9b97;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --green: #1D9E75;
    --green-bg: #E1F5EE;
    --green-text: #0F6E56;
    --red: #D85A30;
    --red-bg: #FAECE7;
    --red-text: #993C1D;
    --blue: #185FA5;
    --blue-bg: #E6F1FB;
    --blue-text: #0C447C;
    --radius: 10px;
    --radius-lg: 14px;
    --font: 'DM Sans', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --bg2: #252523;
      --bg3: #2e2e2b;
      --text: #f0f0ec;
      --text2: #a0a09c;
      --text3: #6a6a66;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.18);
      --green: #2ec48f;
      --green-bg: #0d3326;
      --green-text: #5DCAA5;
      --red: #e87654;
      --red-bg: #3a1a10;
      --red-text: #F0997B;
      --blue: #5fa8e0;
      --blue-bg: #0d2640;
      --blue-text: #85B7EB;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg3); font-family: var(--font); color: var(--text); }
  body { padding: 0; }

  .shell { max-width: 520px; margin: 0 auto; background: var(--bg3); min-height: 100dvh; }

  .topbar {
    background: var(--bg);
    border-bottom: 0.5px solid var(--border);
    padding: 14px 16px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; }
  .topbar-title i { font-size: 18px; color: var(--text2); }
  .month-nav { display: flex; align-items: center; gap: 4px; }
  .nav-btn {
    background: none;
    border: 0.5px solid var(--border2);
    border-radius: 8px;
    width: 32px; height: 32px;
    cursor: pointer;
    color: var(--text2);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-btn:active { background: var(--bg2); }
  .month-label { font-size: 14px; font-weight: 500; min-width: 130px; text-align: center; color: var(--text); }

  .content { padding: 12px 12px 100px; display: flex; flex-direction: column; gap: 12px; }

  .card {
    background: var(--bg);
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border);
    overflow: hidden;
  }
  .card-pad { padding: 14px 16px; }

  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border-radius: var(--radius-lg); overflow: hidden; border: 0.5px solid var(--border); }
  .metric { background: var(--bg); padding: 14px 16px; }
  .metric-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
  .metric-label i { font-size: 12px; }
  .metric-value { font-size: 20px; font-weight: 500; }
  .metric-value.green { color: var(--green); }
  .metric-value.red { color: var(--red); }
  .metric-value.blue { color: var(--blue); }
  .metric-value.pos { color: var(--green); }
  .metric-value.neg { color: var(--red); }

  .credit-banner {
    background: var(--blue-bg);
    border-radius: var(--radius-lg);
    border: 0.5px solid rgba(55,138,221,0.25);
    padding: 12px 14px;
    font-size: 13px;
    color: var(--blue-text);
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .credit-banner i { font-size: 16px; margin-top: 1px; flex-shrink: 0; }

  .section-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: 14px 16px 10px;
  }

  .type-toggle, .pay-toggle {
    display: flex;
    border: 0.5px solid var(--border2);
    border-radius: 8px;
    overflow: hidden;
  }
  .type-toggle button, .pay-toggle button {
    flex: 1;
    padding: 0 10px;
    height: 38px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-family: var(--font);
    background: transparent;
    color: var(--text2);
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .type-toggle button.act-inc { background: var(--green-bg); color: var(--green-text); font-weight: 500; }
  .type-toggle button.act-exp { background: var(--red-bg); color: var(--red-text); font-weight: 500; }
  .pay-toggle button.act-cash { background: var(--green-bg); color: var(--green-text); font-weight: 500; }
  .pay-toggle button.act-card { background: var(--blue-bg); color: var(--blue-text); font-weight: 500; }

  .form-fields { display: flex; flex-direction: column; gap: 8px; padding: 0 16px 14px; }
  .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  input[type=text], input[type=number], input[type=date], input[type=text] {
    width: 100%;
    height: 42px;
    border: 0.5px solid var(--border2);
    border-radius: 8px;
    background: var(--bg2);
    color: var(--text);
    font-size: 14px;
    font-family: var(--font);
    padding: 0 12px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  input:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(55,138,221,0.15); }
  .add-btn {
    width: 100%;
    height: 44px;
    border: none;
    border-radius: 8px;
    background: var(--text);
    color: var(--bg);
    font-size: 14px;
    font-weight: 500;
    font-family: var(--font);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 4px;
  }
  .add-btn:active { opacity: 0.85; transform: scale(0.99); }

  .tx-list { display: flex; flex-direction: column; }
  .tx-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 16px;
    border-bottom: 0.5px solid var(--border);
  }
  .tx-item:last-child { border-bottom: none; }
  .tx-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .tx-dot.income { background: var(--green); }
  .tx-dot.cash { background: var(--red); }
  .tx-dot.card { background: var(--blue); }
  .tx-main { flex: 1; min-width: 0; }
  .tx-desc { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .tx-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .tx-amount { font-size: 13px; font-weight: 500; }
  .tx-amount.income { color: var(--green); }
  .tx-amount.cash { color: var(--red); }
  .tx-amount.card { color: var(--blue); }
  .tx-del {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text3);
    padding: 4px;
    border-radius: 6px;
    font-size: 15px;
    line-height: 1;
  }
  .tx-del:active { background: var(--bg2); color: var(--red); }

  .empty { text-align: center; padding: 2rem 1rem; color: var(--text3); font-size: 13px; }
  .empty i { font-size: 28px; display: block; margin-bottom: 8px; }

  .chart-wrap { position: relative; width: 100%; height: 180px; padding: 0 16px 14px; }

  .legend-row { display: flex; gap: 12px; padding: 0 16px 8px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); }
  .legend-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }

  .hist-row { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 14px; }
  .hist-row::-webkit-scrollbar { display: none; }
  .hist-card {
    background: var(--bg2);
    border-radius: var(--radius);
    padding: 10px 12px;
    min-width: 110px;
    cursor: pointer;
    flex-shrink: 0;
    border: 1px solid transparent;
  }
  .hist-card:active { background: var(--bg3); }
  .hist-card.active { border-color: var(--blue); background: var(--blue-bg); }
  .hist-month { font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
  .hist-nums { display: flex; flex-direction: column; gap: 2px; font-size: 11px; }

  .settings-card { background: var(--bg); border-radius: var(--radius-lg); border: 0.5px solid var(--border); overflow: hidden; }
  .settings-toggle {
    width: 100%;
    background: none;
    border: none;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    font-family: var(--font);
    font-size: 13px;
    color: var(--text2);
  }
  .settings-toggle:active { background: var(--bg2); }
  .settings-body { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 8px; }
  .settings-body label { font-size: 12px; color: var(--text2); margin-bottom: 2px; display: block; }

  .hidden { display: none !important; }

  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-family: var(--font);
    z-index: 100;
    opacity: 0;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="topbar-title">
      <i class="ti ti-report-money"></i>
      Finanzas
    </div>
    <div class="month-nav">
      <button class="nav-btn" id="prev-m" aria-label="Mes anterior"><i class="ti ti-chevron-left"></i></button>
      <span class="month-label" id="month-lbl"></span>
      <button class="nav-btn" id="next-m" aria-label="Mes siguiente"><i class="ti ti-chevron-right"></i></button>
    </div>
  </div>

  <div class="content">

    <div class="metrics" id="metrics-grid"></div>

    <div class="credit-banner hidden" id="credit-banner">
      <i class="ti ti-credit-card"></i>
      <span id="credit-banner-text"></span>
    </div>

    <div class="card">
      <div class="section-label">Nuevo movimiento</div>
      <div style="padding: 0 16px 10px; display: flex; flex-direction: column; gap: 8px;">
        <div class="type-toggle">
          <button id="btn-inc" class="act-inc" onclick="setType('income')"><i class="ti ti-arrow-down-circle" style="font-size:14px"></i> Ingreso</button>
          <button id="btn-exp" onclick="setType('expense')"><i class="ti ti-arrow-up-circle" style="font-size:14px"></i> Gasto</button>
        </div>
        <div class="pay-toggle hidden" id="pay-toggle">
          <button id="btn-cash" class="act-cash" onclick="setPayment('cash')"><i class="ti ti-cash" style="font-size:13px"></i> Contado</button>
          <button id="btn-card" onclick="setPayment('card')"><i class="ti ti-credit-card" style="font-size:13px"></i> Tarjeta</button>
        </div>
      </div>
      <div class="form-fields">
        <input type="text" id="desc-inp" placeholder="Descripción" autocomplete="off" />
        <div class="form-row-2">
          <input type="number" id="amount-inp" placeholder="Monto" min="0" step="0.01" inputmode="decimal" />
          <input type="date" id="date-inp" />
        </div>
        <button class="add-btn" onclick="addTx()"><i class="ti ti-plus" style="font-size:16px"></i> Agregar</button>
      </div>
    </div>

    <div class="card">
      <div class="section-label">Movimientos del mes</div>
      <div class="tx-list" id="tx-list"></div>
    </div>

    <div class="card">
      <div class="section-label">Evolución 6 meses</div>
      <div class="legend-row">
        <span class="legend-item"><span class="legend-dot" style="background:#5DCAA5"></span>Ingresos</span>
        <span class="legend-item"><span class="legend-dot" style="background:#F0997B"></span>Contado</span>
        <span class="legend-item"><span class="legend-dot" style="background:#85B7EB"></span>Crédito cobrado</span>
      </div>
      <div class="chart-wrap">
        <canvas id="hist-chart" role="img" aria-label="Gráfico de barras con ingresos, gastos contado y crédito por mes">Evolución mensual de ingresos y gastos.</canvas>
      </div>
    </div>

    <div class="card">
      <div class="section-label">Historial</div>
      <div class="hist-row" id="hist-row"></div>
    </div>

    <div class="settings-card">
      <button class="settings-toggle" onclick="toggleSettings()">
        <span style="display:flex;align-items:center;gap:8px"><i class="ti ti-settings" style="font-size:15px"></i> Configuración de tarjeta</span>
        <i class="ti ti-chevron-down" id="settings-chevron" style="font-size:15px;transition:transform .2s"></i>
      </button>
      <div class="settings-body hidden" id="settings-body">
        <div>
          <label for="card-name-inp">Nombre de la tarjeta</label>
          <input type="text" id="card-name-inp" placeholder="Visa, Mastercard, Naranja..." />
        </div>
        <div>
          <label for="close-day-inp">Día de cierre</label>
          <input type="number" id="close-day-inp" min="1" max="31" placeholder="25" inputmode="numeric" />
        </div>
        <button class="add-btn" onclick="saveSettings()"><i class="ti ti-check" style="font-size:15px"></i> Guardar configuración</button>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const SK = 'fp_data_v2';
const CK = 'fp_cfg_v2';

let curY, curM, curType = 'income', curPay = 'cash', chartInst = null, settingsOpen = false;

function ld(){ try{ return JSON.parse(localStorage.getItem(SK))||[]; }catch{ return []; } }
function sd(d){ try{ localStorage.setItem(SK,JSON.stringify(d)); }catch{} }
function lc(){ try{ return JSON.parse(localStorage.getItem(CK))||{closeDay:25,cardName:'Tarjeta'}; }catch{ return {closeDay:25,cardName:'Tarjeta'}; } }
function sc(c){ try{ localStorage.setItem(CK,JSON.stringify(c)); }catch{} }

function fmt(v){ return '$'+Math.abs(v).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function mkey(y,m){ return y+'-'+String(m+1).padStart(2,'0'); }
function fmtDate(s){ const[y,mo,d]=s.split('-'); return d+'/'+mo; }

function computeImpactKey(dateStr, closeDay){
  const p=dateStr.split('-').map(Number), y=p[0], m=p[1]-1, d=p[2];
  if(d<=closeDay){
    const nm=m+1>11?0:m+1, ny=m+1>11?y+1:y;
    return mkey(ny,nm);
  } else {
    const nm1=m+1>11?0:m+1, ny1=m+1>11?y+1:y;
    const nm2=nm1+1>11?0:nm1+1, ny2=nm1+1>11?ny1+1:ny1;
    return mkey(ny2,nm2);
  }
}

function setType(t){
  curType=t;
  document.getElementById('btn-inc').className=t==='income'?'act-inc':'';
  document.getElementById('btn-exp').className=t==='expense'?'act-exp':'';
  const pt=document.getElementById('pay-toggle');
  t==='expense'?pt.classList.remove('hidden'):pt.classList.add('hidden');
}

function setPayment(p){
  curPay=p;
  document.getElementById('btn-cash').className=p==='cash'?'act-cash':'';
  document.getElementById('btn-card').className=p==='card'?'act-card':'';
}

function toggleSettings(){
  settingsOpen=!settingsOpen;
  document.getElementById('settings-body').classList.toggle('hidden',!settingsOpen);
  document.getElementById('settings-chevron').style.transform=settingsOpen?'rotate(180deg)':'';
  if(settingsOpen){ const c=lc(); document.getElementById('card-name-inp').value=c.cardName; document.getElementById('close-day-inp').value=c.closeDay; }
}

function saveSettings(){
  const name=document.getElementById('card-name-inp').value.trim()||'Tarjeta';
  const day=parseInt(document.getElementById('close-day-inp').value)||25;
  sc({cardName:name,closeDay:Math.min(31,Math.max(1,day))});
  toggleSettings();
  toast('Configuración guardada');
  render();
}

function addTx(){
  const desc=document.getElementById('desc-inp').value.trim();
  const amount=parseFloat(document.getElementById('amount-inp').value);
  const date=document.getElementById('date-inp').value;
  if(!desc||isNaN(amount)||amount<=0||!date){ toast('Completá descripción, monto y fecha'); return; }
  const cfg=lc();
  const payMethod=curType==='expense'?curPay:'income';
  const tx={id:Date.now(),type:curType,payMethod,desc,amount,date};
  if(curType==='expense'&&curPay==='card') tx.impactKey=computeImpactKey(date,cfg.closeDay);
  const data=ld(); data.push(tx); sd(data);
  document.getElementById('desc-inp').value='';
  document.getElementById('amount-inp').value='';
  toast('Movimiento agregado');
  render();
}

function deleteTx(id){
  if(!confirm('¿Eliminar este movimiento?')) return;
  sd(ld().filter(t=>t.id!==id));
  render();
}

function getStats(data,y,m){
  const key=mkey(y,m);
  const mtx=data.filter(t=>t.date&&t.date.startsWith(key));
  const income=mtx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const cashExp=mtx.filter(t=>t.type==='expense'&&t.payMethod==='cash').reduce((s,t)=>s+t.amount,0);
  const cardAcc=mtx.filter(t=>t.type==='expense'&&t.payMethod==='card').reduce((s,t)=>s+t.amount,0);
  const cardImpact=data.filter(t=>t.type==='expense'&&t.payMethod==='card'&&t.impactKey===key).reduce((s,t)=>s+t.amount,0);
  return{income,cashExp,cardAcc,cardImpact,balance:income-cashExp-cardImpact,monthTx:mtx};
}

function render(){
  const data=ld(), cfg=lc();
  document.getElementById('month-lbl').textContent=MONTHS[curM]+' '+curY;
  const{income,cashExp,cardAcc,cardImpact,balance,monthTx}=getStats(data,curY,curM);

  document.getElementById('metrics-grid').innerHTML=`
    <div class="metric"><div class="metric-label"><i class="ti ti-arrow-down-circle" style="color:var(--green)"></i>Ingresos</div><div class="metric-value green">${fmt(income)}</div></div>
    <div class="metric"><div class="metric-label"><i class="ti ti-cash" style="color:var(--red)"></i>Gastos contado</div><div class="metric-value red">${fmt(cashExp)}</div></div>
    <div class="metric"><div class="metric-label"><i class="ti ti-credit-card" style="color:var(--blue)"></i>Crédito este mes</div><div class="metric-value blue">${fmt(cardAcc)}</div></div>
    <div class="metric"><div class="metric-label"><i class="ti ti-scale" style="color:var(--text2)"></i>Balance real</div><div class="metric-value ${balance>=0?'pos':'neg'}">${balance<0?'-':''}${fmt(balance)}</div></div>
  `;

  const banner=document.getElementById('credit-banner');
  if(cardImpact>0){
    banner.classList.remove('hidden');
    document.getElementById('credit-banner-text').innerHTML=`Se cobran <strong>${fmt(cardImpact)}</strong> de ${cfg.cardName} este mes (gastos de meses anteriores).`;
  } else { banner.classList.add('hidden'); }

  const sorted=[...monthTx].sort((a,b)=>b.date.localeCompare(a.date));
  const list=document.getElementById('tx-list');
  if(!sorted.length){
    list.innerHTML='<div class="empty"><i class="ti ti-inbox"></i>No hay movimientos este mes</div>';
  } else {
    list.innerHTML=sorted.map(t=>{
      const dc=t.type==='income'?'income':t.payMethod==='card'?'card':'cash';
      const prefix=t.type==='income'?'+':'-';
      const sub=t.payMethod==='card'&&t.impactKey?`${cfg.cardName} · impacta ${t.impactKey}`:t.type==='income'?'Ingreso':'Contado';
      return `<div class="tx-item">
        <span class="tx-dot ${dc}"></span>
        <div class="tx-main">
          <div class="tx-desc">${t.desc}</div>
          <div class="tx-sub">${fmtDate(t.date)} · ${sub}</div>
        </div>
        <div class="tx-right">
          <span class="tx-amount ${dc}">${prefix}${fmt(t.amount)}</span>
          <button class="tx-del" onclick="deleteTx(${t.id})" aria-label="Eliminar"><i class="ti ti-x"></i></button>
        </div>
      </div>`;
    }).join('');
  }

  renderChart(data); renderHist(data,cfg);
}

function renderChart(data){
  const months=[];
  for(let i=5;i>=0;i--){ let m=curM-i,y=curY; while(m<0){m+=12;y--;} months.push({y,m}); }
  const labels=months.map(({y,m})=>MONTHS[m].slice(0,3));
  const inc=months.map(({y,m})=>getStats(data,y,m).income);
  const cash=months.map(({y,m})=>getStats(data,y,m).cashExp);
  const card=months.map(({y,m})=>getStats(data,y,m).cardImpact);
  if(chartInst) chartInst.destroy();
  const isDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  chartInst=new Chart(document.getElementById('hist-chart'),{
    type:'bar',
    data:{labels,datasets:[
      {label:'Ingresos',data:inc,backgroundColor:'#5DCAA5',borderRadius:3},
      {label:'Contado',data:cash,backgroundColor:'#F0997B',borderRadius:3},
      {label:'Crédito cobrado',data:card,backgroundColor:'#85B7EB',borderRadius:3}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{grid:{display:false},ticks:{font:{size:10},color:isDark?'#6a6a66':'#9b9b97',autoSkip:false}},
        y:{grid:{color:isDark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.06)'},ticks:{font:{size:10},color:isDark?'#6a6a66':'#9b9b97',callback:v=>'$'+v.toLocaleString('es-AR')}}
      }
    }
  });
}

function renderHist(data,cfg){
  const months=[];
  for(let i=5;i>=0;i--){ let m=curM-i,y=curY; while(m<0){m+=12;y--;} months.push({y,m}); }
  const cur=mkey(curY,curM);
  document.getElementById('hist-row').innerHTML=months.map(({y,m})=>{
    const k=mkey(y,m);
    const{income,cashExp,cardImpact,balance}=getStats(data,y,m);
    return `<div class="hist-card${k===cur?' active':''}" onclick="goMonth(${y},${m})">
      <div class="hist-month">${MONTHS[m].slice(0,3)} ${y}</div>
      <div class="hist-nums">
        <span style="color:var(--green)">+${fmt(income)}</span>
        <span style="color:var(--red)">-${fmt(cashExp+cardImpact)}</span>
        <span style="font-weight:500;color:${balance>=0?'var(--green)':'var(--red)'}">${balance<0?'-':''}${fmt(balance)}</span>
      </div>
    </div>`;
  }).join('');
}

function goMonth(y,m){ curY=y; curM=m; render(); }

let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}

document.getElementById('prev-m').addEventListener('click',()=>{ curM--; if(curM<0){curM=11;curY--;} render(); });
document.getElementById('next-m').addEventListener('click',()=>{ curM++; if(curM>11){curM=0;curY++;} render(); });

(function init(){
  const now=new Date();
  curY=now.getFullYear(); curM=now.getMonth();
  document.getElementById('date-inp').value=now.toISOString().split('T')[0];
  render();
})();
</script>
</body>
</html>
